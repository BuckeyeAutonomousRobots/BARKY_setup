; Open this project folder in VS Code with PlatformIO IDE installed.
; The Arduino framework is a dependency, not the Arduino IDE.
[platformio]
default_envs = nano33ble
src_dir = firmware/src
include_dir = firmware/include

[env:nano33ble]
monitor_dtr = 1
monitor_rts = 0
platform = nordicnrf52@11.0.0
board = nano33ble
framework = arduino
platform_packages =
    platformio/framework-arduino-mbed@4.6.0
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150@1.2.4
monitor_speed = 115200
; Set only if auto-detection selects the wrong device:
; upload_port = COM5
; monitor_port = COM5
; On Linux use the detected /dev/serial/by-id/... or /dev/ttyACM* path.
